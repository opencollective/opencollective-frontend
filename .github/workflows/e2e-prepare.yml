name: E2E prepare

# Called from ci.yml in parallel with the frontend build. Uploads API/images/PDF
# dist artifacts so Cypress shards do not rebuild the stack.

on:
  workflow_call:
    outputs:
      api-ref:
        description: Resolved opencollective-api commit SHA
        value: ${{ jobs.prepare.outputs.api-ref }}
      images-ref:
        description: Resolved opencollective-images commit SHA
        value: ${{ jobs.prepare.outputs.images-ref }}
      pdf-ref:
        description: Resolved opencollective-pdf commit SHA
        value: ${{ jobs.prepare.outputs.pdf-ref }}

# Reusable workflows do not inherit env from ci.yml. OC_ENV=ci skips the API
# postinstall DB restore, which needs Postgres that this job does not run.
env:
  CI: true
  OC_ENV: ci

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      api-ref: ${{ steps.checkout-stack.outputs.api-ref }}
      images-ref: ${{ steps.checkout-stack.outputs.images-ref }}
      pdf-ref: ${{ steps.checkout-stack.outputs.pdf-ref }}

    steps:
      - name: Checkout (frontend)
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true

      - name: Checkout E2E stack
        id: checkout-stack
        uses: ./.github/actions/checkout-e2e-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules (api)
        uses: actions/cache@v6
        id: api-node-modules
        with:
          path: opencollective-api/node_modules
          key: ${{ runner.os }}-api-node-modules-${{ hashFiles('opencollective-api/package-lock.json') }}

      - name: Install dependencies (api)
        working-directory: opencollective-api
        if: steps.api-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (images)
        uses: actions/cache@v6
        id: images-node-modules
        with:
          path: opencollective-images/node_modules
          key: ${{ runner.os }}-images-node-modules-${{ hashFiles('opencollective-images/package-lock.json') }}

      - name: Install dependencies (images)
        working-directory: opencollective-images
        if: steps.images-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore node_modules (pdf)
        uses: actions/cache@v6
        id: pdf-node-modules
        with:
          path: opencollective-pdf/node_modules
          key: ${{ runner.os }}-pdf-node-modules-${{ hashFiles('opencollective-pdf/package-lock.json') }}

      - name: Install dependencies (pdf)
        working-directory: opencollective-pdf
        if: steps.pdf-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build API, images, and PDF
        run: |
          set -eu
          fail=0
          (cd opencollective-api && npm run build) &
          api_pid=$!
          (cd opencollective-images && npm run build) &
          images_pid=$!
          (cd opencollective-pdf && npm run build) &
          pdf_pid=$!
          wait "$api_pid" || { echo "API build failed"; fail=1; }
          wait "$images_pid" || { echo "Images build failed"; fail=1; }
          wait "$pdf_pid" || { echo "PDF build failed"; fail=1; }
          exit "$fail"

      - name: Stage service dist artifacts
        run: |
          set -euo pipefail
          stage=/tmp/e2e-service-dists
          mkdir -p "$stage/opencollective-api" "$stage/opencollective-images" "$stage/opencollective-pdf"
          cp -a opencollective-api/dist "$stage/opencollective-api/dist"
          cp -a opencollective-images/dist "$stage/opencollective-images/dist"
          cp -a opencollective-pdf/dist "$stage/opencollective-pdf/dist"
          test -f "$stage/opencollective-api/dist/e2e.js"
          test -e "$stage/opencollective-images/dist/server"
          test -f "$stage/opencollective-pdf/dist/server/index.js"

      - name: Upload service dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: e2e-service-dists
          path: /tmp/e2e-service-dists
          if-no-files-found: error
          retention-days: 1
