name: CI

# Security: Do not replace `pull_request` with `pull_request_target` to expose secrets or
# GITHUB_TOKEN write access to PR code. pull_request_target runs untrusted fork PR code with
# base-branch privileges.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TZ: UTC
  OC_ENV: ci
  NODE_ENV: test
  WEBSITE_URL: http://localhost:3000
  API_URL: http://localhost:3060
  PDF_SERVICE_URL: http://localhost:3002
  API_KEY: dvl-1510egmf4a23d80342403fb599qd
  CI: true
  DISABLE_MOCK_UPLOADS: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-eslint-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-eslint-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-

      - run: npm run lint:quiet
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  prettier:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore Prettier cache
        uses: actions/cache@v6
        with:
          path: .prettiercache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-prettier-${{ hashFiles('.prettierrc', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-prettier-${{ hashFiles('.prettierrc', 'package-lock.json') }}-

      - run: npm run prettier:check

  depcheck:
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run depcheck

  ts-unused-exports:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run ts-unused-exports

  check-langs:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run langs:check

  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore NextJS build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: PRESERVE_NEXT_CACHE=true npm run build

      # Stage to a non-hidden directory so upload-artifact cannot drop `.next`.
      # Copy only; leave workspace `.next/cache` for the cache post-save step.
      - name: Stage Next.js build
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontend-next
          rsync -a --exclude cache/ .next/ /tmp/frontend-next/
          test -f /tmp/frontend-next/BUILD_ID
          test -f /tmp/frontend-next/routes-manifest.json
          # `npm run build` also writes outside .next/: next.config.js copies the pdf.js worker and cMaps into
          # public/static/ (gitignored). Production builds and serves from the same directory (server/index.ts
          # starts Next from the project root), so it serves them from there. The e2e jobs don't build: they
          # start from a fresh checkout and get only what this artifact carries, so these generated files must
          # travel with .next/ (restored in e2e.yml), or the e2e server answers 404 for the worker.
          mkdir -p /tmp/frontend-next/_generated-public/static/scripts
          cp public/static/scripts/pdf.worker.min.mjs /tmp/frontend-next/_generated-public/static/scripts/
          rsync -a public/static/cmaps /tmp/frontend-next/_generated-public/static/

      - name: Upload Next.js build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-next
          path: /tmp/frontend-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run test:jest -- --reporters=default --reporters=jest-junit

      - name: Test with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:coverage

      - name: Report coverage
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: GraphQL

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  typescript:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore TypeScript incremental cache
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-tsc-${{ hashFiles('tsconfig.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-tsc-${{ hashFiles('tsconfig.json', 'package-lock.json') }}-

      - run: npm run type:check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Cost of the frontend operations against the API schema, with its weights and list sizes
  # (opencollective/opencollective#9084): reports the operations over the maximum or close to it, and the cost changes
  # compared to the base branch. Report only until the maximum is calibrated (opencollective/opencollective#9086).
  graphql-cost:
    name: GraphQL query cost
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      # Skips the API postinstall DB restore, which needs Postgres
      OC_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Get Node major version
        id: node-major
        run: echo "version=$(node -p 'process.versions.node.split(`.`)[0]')" >> "$GITHUB_OUTPUT"

      # Same API revision as the E2E workflow: the branch with the same name, otherwise main
      - name: Checkout API
        id: checkout-stack
        uses: ./.github/actions/checkout-e2e-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the API command
        id: api-command
        env:
          API_REF: ${{ steps.checkout-stack.outputs.api-ref }}
        run: |
          if [ -f opencollective-api/scripts/graphql-cost.ts ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            message="The API revision ${API_REF} does not have the query cost command (scripts/graphql-cost.ts) yet, skipping the report."
            echo "::notice title=GraphQL query cost::${message}"
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore node_modules (api)
        if: steps.api-command.outputs.available == 'true'
        uses: actions/cache@v6
        id: api-node-modules
        with:
          path: opencollective-api/node_modules
          key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-api-node-modules-${{ hashFiles('opencollective-api/package-lock.json') }}

      - name: Install dependencies (api)
        if: steps.api-command.outputs.available == 'true' && steps.api-node-modules.outputs.cache-hit != 'true'
        working-directory: opencollective-api
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Checkout base revision
        if: steps.api-command.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: frontend-base
          persist-credentials: false

      - name: Report
        if: steps.api-command.outputs.available == 'true'
        env:
          API_REF: ${{ steps.checkout-stack.outputs.api-ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/graphql-cost"
          mkdir -p "${out}"
          npx tsx scripts/extract-graphql-operations.ts "${out}/operations"

          # Baseline: the operations of the base branch, against the same API revision
          baseline=()
          compared_to="not computed"
          if npx tsx scripts/extract-graphql-operations.ts "${out}/base-operations" frontend-base \
            && (cd opencollective-api && npm run graphql:cost -- "${out}/base-operations" \
              --variables "${out}/base-operations/variables.json" --json "${out}/base.json" --markdown /dev/null); then
            baseline=(--baseline "${out}/base.json")
            compared_to="compared to the operations of ${BASE_REF}"
          else
            echo "::warning title=GraphQL query cost::Could not compute the cost of the operations of ${BASE_REF}, the report does not compare costs"
          fi

          (cd opencollective-api && npm run graphql:cost -- "${out}/operations" \
            --variables "${out}/operations/variables.json" "${baseline[@]}" \
            --heading "GraphQL query cost" --json "${out}/report.json" --markdown "${out}/report.md")
          {
            cat "${out}/report.md"
            echo ""
            echo "API revision: opencollective/opencollective-api@${API_REF}. Cost changes: ${compared_to}."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report
        if: ${{ !cancelled() && steps.api-command.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: graphql-cost
          path: ${{ runner.temp }}/graphql-cost/*.json
          if-no-files-found: ignore
          retention-days: 14

  e2e-prepare:
    uses: ./.github/workflows/e2e-prepare.yml
    secrets: inherit

  # Cypress E2E (checks `e2e / e2e (N*.(js|ts))`). Set the repository variable `DISABLE_CYPRESS` to `true`
  # (Settings > Secrets and variables > Actions > Variables) to skip it while the specs stay in the repository.
  # Remove the shard checks from the required checks first: a skipped matrix reports one unexpanded check, so the
  # per-shard required checks would wait forever.
  e2e:
    if: ${{ vars.DISABLE_CYPRESS != 'true' }}
    needs: [build, e2e-prepare]
    uses: ./.github/workflows/e2e.yml
    with:
      api-ref: ${{ needs.e2e-prepare.outputs.api-ref }}
      images-ref: ${{ needs.e2e-prepare.outputs.images-ref }}
      pdf-ref: ${{ needs.e2e-prepare.outputs.pdf-ref }}
    secrets: inherit

  # Playwright E2E (check `e2e-playwright / playwright`): all specs under
  # test/playwright/specs, with original-attempt evidence. Intended to be a
  # required check; see the header of e2e-playwright.yml for the rollback order.
  e2e-playwright:
    needs: [build, e2e-prepare]
    uses: ./.github/workflows/e2e-playwright.yml
    with:
      api-ref: ${{ needs.e2e-prepare.outputs.api-ref }}
      images-ref: ${{ needs.e2e-prepare.outputs.images-ref }}
      pdf-ref: ${{ needs.e2e-prepare.outputs.pdf-ref }}
    secrets: inherit
