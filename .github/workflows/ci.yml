name: CI

# Security: Do not replace `pull_request` with `pull_request_target` to expose secrets or
# GITHUB_TOKEN write access to PR code. pull_request_target runs untrusted fork PR code with
# base-branch privileges.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
  TURBO_TEAM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURBO_TEAM || '' }}
  TURBO_AGENT_GUIDANCE: 'false'
  TURBO_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN != '' && vars.TURBO_TEAM != '' && 'local:rw,remote:rw' || 'local:rw' }}
  TZ: UTC
  OC_ENV: ci
  NODE_ENV: test
  WEBSITE_URL: http://localhost:3000
  API_URL: http://localhost:3060
  PDF_SERVICE_URL: http://localhost:3002
  API_KEY: dvl-1510egmf4a23d80342403fb599qd
  CI: true
  DISABLE_MOCK_UPLOADS: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run turbo -- run lint:quiet
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  prettier:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run turbo -- run prettier:check

  depcheck:
    runs-on: ${{ vars.CI_RUNNER_LARGE || vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run turbo -- run depcheck

  ts-unused-exports:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run turbo -- run ts-unused-exports

  check-langs:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run turbo -- run langs:check

  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Restore NextJS build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: PRESERVE_NEXT_CACHE=true npm run turbo -- run build:finalize

      # Stage to a non-hidden directory so upload-artifact cannot drop `.next`.
      # Copy only; leave workspace `.next/cache` for the cache post-save step.
      - name: Stage Next.js build
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontend-next
          rsync -a --exclude cache/ .next/ /tmp/frontend-next/
          test -f /tmp/frontend-next/BUILD_ID
          test -f /tmp/frontend-next/routes-manifest.json

      - name: Upload Next.js build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-next
          path: /tmp/frontend-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - name: Test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run turbo -- run test:jest -- --reporters=default --reporters=jest-junit

      - name: Test with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run turbo -- run test:coverage

      - name: Report coverage
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: GraphQL

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  typescript:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          CACHE_VERSION: ${{ secrets.CACHE_VERSION }}

      - run: npm run turbo -- run type:check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e-prepare:
    uses: ./.github/workflows/e2e-prepare.yml
    secrets: inherit

  e2e:
    needs: [build, e2e-prepare]
    uses: ./.github/workflows/e2e.yml
    with:
      api-ref: ${{ needs.e2e-prepare.outputs.api-ref }}
      images-ref: ${{ needs.e2e-prepare.outputs.images-ref }}
      pdf-ref: ${{ needs.e2e-prepare.outputs.pdf-ref }}
    secrets: inherit
