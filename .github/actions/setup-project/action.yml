name: Setup project
description: Installs the right node version and dependencies
inputs:
  CACHE_VERSION:
    description: The cache version, to manually invalidate the dependencies cache
    required: true
runs:
  using: 'composite'
  steps:
    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
        check-latest: true
        cache: 'npm'

    - name: Get Node major version
      id: node-major
      shell: bash
      run: echo "version=$(node -p 'process.versions.node.split(`.`)[0]')" >> "$GITHUB_OUTPUT"

    - name: Restore node_modules
      uses: actions/cache@v6
      id: node-modules
      with:
        path: node_modules
        key: ${{ runner.os }}-node${{ steps.node-major.outputs.version }}-node-modules-${{ hashFiles('package-lock.json') }}-${{ inputs.CACHE_VERSION }}

    - name: Install dependencies
      shell: bash
      if: steps.node-modules.outputs.cache-hit != 'true'
      run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit --no-fund
