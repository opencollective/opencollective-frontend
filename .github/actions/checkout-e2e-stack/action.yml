name: Checkout E2E stack
description: Checkout API, images, and PDF using pinned refs or matching branches
inputs:
  api-ref:
    description: Pin API checkout to this SHA or ref. If empty, resolve a matching branch then main.
    required: false
    default: ''
  images-ref:
    description: Pin images checkout to this SHA or ref. If empty, resolve a matching branch then main.
    required: false
    default: ''
  pdf-ref:
    description: Pin PDF checkout to this SHA or ref. If empty, resolve a matching branch then main.
    required: false
    default: ''
  github-token:
    description: Token used to resolve the API ref and check out stack repositories
    required: false
    default: ${{ github.token }}
outputs:
  api-ref:
    description: Resolved API commit SHA
    value: ${{ steps.record-refs.outputs.api-ref }}
  images-ref:
    description: Resolved images commit SHA
    value: ${{ steps.record-refs.outputs.images-ref }}
  pdf-ref:
    description: Resolved PDF commit SHA
    value: ${{ steps.record-refs.outputs.pdf-ref }}
runs:
  using: composite
  steps:
    - name: Resolve stack refs
      id: resolve-refs
      shell: bash
      env:
        API_REF_INPUT: ${{ inputs.api-ref }}
        IMAGES_REF_INPUT: ${{ inputs.images-ref }}
        PDF_REF_INPUT: ${{ inputs.pdf-ref }}
      run: |
        set -euo pipefail
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

        # actions/checkout already configures authentication; do not add another
        # Authorization extraheader when resolving companion branches.
        resolve_head() {
          git ls-remote --heads "$1" "refs/heads/${2}" \
            | awk -v ref="refs/heads/${2}" '$2 == ref { print $1 }'
        }

        resolve_ref() {
          local service="$1" repository="$2" pinned="$3"
          local sha
          if [ -n "$pinned" ]; then
            sha="$pinned"
            echo "Using pinned $service ref $sha"
          else
            sha="$(resolve_head "$repository" "$BRANCH")"
            if [ -z "$sha" ] && [ "$BRANCH" != "main" ]; then
              echo "No matching $service branch '$BRANCH', falling back to main"
              sha="$(resolve_head "$repository" main)"
            fi
            if [ -z "$sha" ]; then
              echo "Failed to resolve opencollective-$service ref" >&2
              return 1
            fi
            echo "Resolved $service ref $sha"
          fi
          echo "$service-ref=$sha" >> "$GITHUB_OUTPUT"
        }

        resolve_ref api https://github.com/opencollective/opencollective-api.git "$API_REF_INPUT"
        resolve_ref images https://github.com/opencollective/opencollective-images.git "$IMAGES_REF_INPUT"
        resolve_ref pdf https://github.com/opencollective/opencollective-pdf.git "$PDF_REF_INPUT"

    - name: Checkout (api)
      uses: actions/checkout@v7
      with:
        repository: opencollective/opencollective-api
        path: opencollective-api
        ref: ${{ steps.resolve-refs.outputs.api-ref }}
        token: ${{ inputs.github-token }}
        persist-credentials: false

    - name: Checkout (images)
      uses: actions/checkout@v7
      with:
        repository: opencollective/opencollective-images
        path: opencollective-images
        ref: ${{ steps.resolve-refs.outputs.images-ref }}
        token: ${{ inputs.github-token }}
        persist-credentials: false

    - name: Checkout (PDF)
      uses: actions/checkout@v7
      with:
        repository: opencollective/opencollective-pdf
        path: opencollective-pdf
        ref: ${{ steps.resolve-refs.outputs.pdf-ref }}
        token: ${{ inputs.github-token }}
        persist-credentials: false

    - name: Record stack refs
      id: record-refs
      shell: bash
      run: |
        set -euo pipefail
        API_SHA="$(git -C opencollective-api rev-parse HEAD)"
        IMAGES_SHA="$(git -C opencollective-images rev-parse HEAD)"
        PDF_SHA="$(git -C opencollective-pdf rev-parse HEAD)"
        echo "api-ref=${API_SHA}" >> "${GITHUB_OUTPUT}"
        echo "images-ref=${IMAGES_SHA}" >> "${GITHUB_OUTPUT}"
        echo "pdf-ref=${PDF_SHA}" >> "${GITHUB_OUTPUT}"
        echo "API ${API_SHA}"
        echo "images ${IMAGES_SHA}"
        echo "PDF ${PDF_SHA}"
